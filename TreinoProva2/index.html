<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treino Prova 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comme:wght@200&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styless.css">
</head>
<body>
    <main>
        <h1>Carrinho de Compras Mágico</h1>

        <div class="container">

            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome"></input>

            <div class="b_quant">
                <button id="verde">+</button>
                <p id='um'>1</p>
                <button id="vermelho">-</button>
            </div>

            <button id="b_add">Adicionar</button>
            
        </div>

        <div class="produtos">
            <p id="titulo">Meus Produtos</p>
            <ul></ul>
            <p id="total">Total de Produtos: <span id="ptotal">0</span></p>

        </div>

    </main>
    <footer>
        <p>Feito com &hearts; por <a href="https://github.com/JoaoPedroGarciaTorezan" target="_blank">João Pedro Garcia Torezan</a></p>
    </footer>
    
    <script src="main.js"></script>
</body>
</html>
