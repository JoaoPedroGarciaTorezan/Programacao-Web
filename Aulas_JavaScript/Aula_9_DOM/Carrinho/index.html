<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mata Atlântica</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Savate:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="body-container">
        <header class="header">
            <nav class="nav-header">
                <ul>
                    <li><a href="">Sobre</a></li> |
                    <li><a href="">Home</a></li>
                </ul>
            </nav>
            <nav class="nav-header">
                <ul>
                    <li><a href="">Login</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <h1>Bem Vindos a Mata Atlântica</h1>

            <div class="add-produtos-container">
                <h2>Procure e Adicione seus Produtos</h2>
                <div class="formulario">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" placeholder="Descrição">
                    <label for="">Preço</label>
                    <input id="preco" type="text" placeholder="Preço">
                    <button id="btn-add">Adicionar</button>
                </div>
            </div>
            
            <div class="carrinho-container">
                <h2>Seus Produtos</h2>
                <div class="carrinho">
                    
                </div>
            </div>
        </main>
        <footer>
            Feito com &hearts; por <a href="">GitHub</a>
        </footer>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
