<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="styless.css">
</head>
<body>

    <main>

        <div class="calculadora">

            <div class="display">0</div>

            <button class="operador circular">+</button>
            <button class="operador circular">-</button>
            <button class="operador circular">x</button>
            <button class="operador circular">&#247</button>

            <button class="operando circular">7</button>
            <button class="operando circular">8</button>
            <button class="operando circular">9</button>

            <button class="igual">=</button>

            <button class="operando circular">4</button>
            <button class="operando circular">5</button>
            <button class="operando circular">6</button>
            <button class="operando circular">1</button>
            <button class="operando circular">2</button>
            <button class="operando circular">3</button>
            <button class="operando circular">0</button>
            <button class="operando circular">.</button>
            <button class="operando circular">C</button>

        </div>
    </main>
    
</body>
</html>
